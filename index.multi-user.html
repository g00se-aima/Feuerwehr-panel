<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <!-- iOS standalone meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Feuerwehr Panel" />
  <link rel="manifest" href="manifest.webmanifest">
  <title>Feuerwehr Panel (SPA) - Multi-User Mode</title>
  <!-- Cache-busting query to avoid stale SW/browser cache -->
  <link rel="stylesheet" href="style.css?v=20251207_2" />
  
  <!-- Enable API storage for multi-user access -->
  <script>
    // Configuration for multi-user mode
    window.USE_API_STORAGE = true;
    window.API_BASE_URL = 'http://localhost:3000/api';
    
    // If your server is on a different machine, update the URL:
    // window.API_BASE_URL = 'http://192.168.1.100:3000/api';
    
    console.log('Multi-user mode enabled. API URL:', window.API_BASE_URL);
  </script>
</head>
<body data-server-no-reload>
  <header id="app-header"></header>
  <main id="app-main" class="container"></main>
  <div id="modal-root"></div>
  <!-- API Storage Adapter (optional - for multi-user mode) -->
  <script src="api-storage.js"></script>
  <!-- Single consolidated SPA runtime (cache-busted) -->
  <script src="spa.js?v=20251207_2"></script>
</body>
</html>
